name: Update README project list

on:
  push:
    paths:
      - "_data/projects/**"
      - "scripts/update-readme-projects.rb"
  workflow_dispatch:

concurrency:
  group: update-readme-projects
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Generate project list
        run: ruby scripts/update-readme-projects.rb

      - name: Commit README changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No README changes required."
          else
            git commit -m "docs: update project list"
            git push
          fi
