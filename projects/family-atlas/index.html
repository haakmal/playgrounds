<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Atlas</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="toolbar"><div class="identity"><strong>Family Atlas</strong><small id="collectionTitle">Local collection</small></div><div class="tools"><button id="detailBackBtn" class="hidden">← Radial atlas</button><button id="searchBtn">Search</button><button id="traceBtn">Trace path</button><button id="importBtn">Import</button><button id="exportBtn">Export</button><button id="menuBtn">More</button><button id="addBtn" class="primary">+ Add person</button></div></header>
<div class="main"><div class="stage" id="stage"><svg id="atlas" role="group" aria-label="Radial descendant atlas"><g id="world"><g id="edges"></g><g id="nodes"></g></g></svg><details class="graphLegend"><summary>Connections</summary><div><span class="keyLine solid"></span>Parentage</div><div><span class="keyLine fine"></span>Explicit sibling</div><div><span class="keyLine dashed"></span>Partnership</div><div><span class="keyLine dotted"></span>Guardian / other</div><p>Rings show successive levels of descent, not ages. Long-distance links are subdued until selection or tracing.</p></details><div class="status" id="status">Drag to pan · Scroll to zoom · Select a person</div><div class="zoomControls"><button id="zoomIn" aria-label="Zoom in">+</button><button id="zoomOut" aria-label="Zoom out">−</button><button id="zoomFit" aria-label="Fit all networks">All</button></div></div><aside id="side" class="side hidden"></aside></div>
<div id="modal" class="modalBackdrop hidden"><section class="modalCard"><div class="modalHead"><strong id="modalTitle"></strong><button id="modalClose" aria-label="Close">×</button></div><div id="modalBody"></div></section></div>
<input id="fileInput" type="file" accept="application/json,.json" hidden><div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="app.js"></script></body></html>
