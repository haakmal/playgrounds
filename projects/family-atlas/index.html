<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Atlas</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="toolbar"><div class="identity"><strong>Family Atlas</strong><small id="collectionTitle">Local collection</small></div><div class="tools"><div class="viewSwitch" role="group" aria-label="Rendering mode"><button data-view="atlas">Atlas</button><button data-view="family">Network</button><button data-view="radial">Radial</button><button data-view="lineage">Lineage</button></div><button id="searchBtn">Search</button><button id="focusBtn">Focus</button><button id="traceBtn">Trace path</button><button id="fitBtn">Fit all</button><button id="importBtn">Import</button><button id="exportBtn">Export</button><button id="menuBtn">More</button><button id="addBtn" class="primary">+ Add person</button></div></header>
<div class="main"><div class="stage" id="stage"><svg id="atlas" role="img" aria-label="Family graph"><g id="world"><g id="edges"></g><g id="nodes"></g></g></svg><div class="status" id="status">Drag to pan · Scroll to zoom · Select a person</div><div class="zoomControls"><button id="zoomIn" aria-label="Zoom in">+</button><button id="zoomOut" aria-label="Zoom out">−</button><button id="zoomFit" aria-label="Fit network">Fit</button></div></div><aside id="side" class="side hidden"></aside></div>
<div id="modal" class="modalBackdrop hidden"><section class="modalCard"><div class="modalHead"><strong id="modalTitle"></strong><button id="modalClose" aria-label="Close">×</button></div><div id="modalBody"></div></section></div>
<input id="fileInput" type="file" accept="application/json,.json" hidden><div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="app.js"></script></body></html>
