<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Contextual Modelling Companion</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <div class="app">
            <header class="topbar">
                <div class="brand">
                    <strong>Interaction Design Stream</strong><span>Contextual Modelling Companion</span>
                </div>
                <div class="actions">
                    <button class="btn" id="aboutBtn">About</button><button class="btn" id="helpBtn">?</button>
                </div>
                <div class="mobile-actions">
                    <button class="btn" id="mobileBackBtn">← Back</button
                    ><button class="btn" id="mobileNextBtn">Next →</button>
                </div>
            </header>
            <main id="app" class="workspace"></main>
            <footer class="footer-nav">
                <button id="backBtn" class="btn">← Back</button><span id="progress">01 / 06</span
                ><button id="nextBtn" class="btn primary">Begin →</button>
            </footer>
        </div>
        <dialog id="modal">
            <div class="modal-head">
                <strong id="modalTitle"></strong><button class="btn" id="closeModal">Close</button>
            </div>
            <div id="modalBody" class="modal-body"></div>
            <div id="modalFooter" class="modal-footer"></div>
        </dialog>
        <script src="app.js"></script>
    
<!-- BEGIN RETURN LINK -->
<script>
// inject-home-link.js
(function () {
	// Inject Font Awesome stylesheet
	const fa = document.createElement("link");
	fa.rel = "stylesheet";
	fa.href = "https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css";
	fa.crossOrigin = "anonymous";
	document.head.appendChild(fa);
	
	// Create the back link
	const link = document.createElement("a");
	link.href = "/";
	link.innerHTML = '← Back to Playgrounds <i class="fab fa-github"><i>';
	Object.assign(link.style, {
	  position: "fixed",
	  bottom: "20px",
	  right: "20px",
	  background: "#000",
	  color: "#fff",
	  padding: "8px 12px",
	  zIndex: 1000,
	  fontSize: "14px",
	  opacity: 0.7,
	  borderRadius: "6px",
	  textDecoration: "none"
	});
	link.onmouseover = () => (link.style.opacity = "1");
	link.onmouseout = () => (link.style.opacity = "0.7");
	document.body.appendChild(link);
})();
</script>
<!-- END RETURN LINK -->

</body>
</html>
