<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Possibility Engine</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="intro-pending">
    <section id="intro" class="intro-screen" aria-label="Welcome">
      <div class="intro-field" aria-hidden="true"></div>
      <div class="intro-copy">
        <p id="introEyebrow" class="eyebrow"></p>
        <h1><span id="introTitle"></span><br /><em id="introEmphasis"></em></h1>
        <p id="introDescription"></p>
      </div>
    </section>
    <main class="machine" aria-live="polite">
      <div class="machine-top"><span class="eyebrow">POSSIBILITY ENGINE</span></div>
      <section id="display" class="display">
        <p class="eyebrow">TRY A DIFFERENT ANGLE</p>
        <h1 id="promptTitle">Design for Breakdowns</h1>
        <p id="promptBody"></p>
        <p id="promptNote" class="note"></p>
      </section>
      <div class="controls">
        <label class="mode-panel" for="modeSelect"
          ><span class="eyebrow">PROMPT MODE</span
          ><select id="modeSelect" aria-label="Prompt mode"></select
        ></label>
        <button id="spinButton" class="spin-button">
          <span class="spin-core"
            ><b>Spin</b><small class="spin-status"><i></i><span id="statusLabel">Ready to shift perspective</span></small></span
          ><span class="spin-arrow">↗</span>
        </button>
      </div>
      <p class="help">There is no right answer. Use the prompt as a way into a sketch, a scenario, a conversation, or a question.</p>
    </main>
    <script src="app.js"></script>
  
<!-- BEGIN RETURN LINK -->
<script>
// inject-home-link.js
(function () {
	// Inject Font Awesome stylesheet
	const fa = document.createElement("link");
	fa.rel = "stylesheet";
	fa.href = "https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css";
	fa.crossOrigin = "anonymous";
	document.head.appendChild(fa);
	
	// Create the back link
	const link = document.createElement("a");
	link.href = "/";
  	link.className = "print-remove";
	link.innerHTML = '← Back to Playgrounds <i class="fab fa-github"><i>';
	Object.assign(link.style, {
	  position: "fixed",
	  bottom: "20px",
	  right: "20px",
	  background: "#000",
	  color: "#fff",
	  padding: "8px 12px",
	  zIndex: 1000,
	  fontSize: "14px",
	  opacity: 0.7,
	  borderRadius: "6px",
	  textDecoration: "none",
    fontFamily: "Helvetica,Arial, sans-serif"
	});
	link.onmouseover = () => (link.style.opacity = "1");
	link.onmouseout = () => (link.style.opacity = "0.7");
	document.body.appendChild(link);
})();
</script>
<!-- END RETURN LINK -->

</body>
</html>
